<template>
    <div class="app-wrapper" onclick={closeAllRowMenus}>
        <div class="app-container">

            <!-- ================= TOP HERO BANNER ================= -->
            <header class="header-hero-panel">
                <div class="header-left-brand">
                    <div class="header-icon-container">
                        <lightning-icon icon-name="standard:case" size="medium" variant="inverse"></lightning-icon>
                    </div>
                    <div class="header-text-group">
                        <div class="header-pre-title">CUSTOMER SUPPORT</div>
                        <h1 class="header-title-text">CASE MANAGEMENT</h1>
                        <p class="header-subtitle-text">Automated | Integrated | Intelligent | Customer Centric</p>
                    </div>
                </div>
                <div class="header-right-status">
                    <div class="live-support-badge">
                        <span class="pulsing-dot"></span>
                        <span class="live-badge-text">● SYSTEM OPERATIONAL</span>
                    </div>
                </div>
            </header>

            <!-- ================= KPI METRICS STRIP (5 CARDS) ================= -->
            <div class="kpi-grid">
                <!-- TOTAL CASES -->
                <div class="kpi-card kpi-total">
                    <div class="kpi-top-bar"></div>
                    <div class="kpi-header">
                        <span class="kpi-label">TOTAL CASES</span>
                        <div class="kpi-icon-bubble">
                            <lightning-icon icon-name="utility:case" size="small" variant="brand"></lightning-icon>
                        </div>
                    </div>
                    <div class="kpi-body">
                        <div class="kpi-number">{metrics.total}</div>
                        <div class="kpi-footer-status">
                            <lightning-icon icon-name="utility:graph" size="x-small"></lightning-icon>
                            <span>Total support tickets</span>
                        </div>
                    </div>
                </div>

                <!-- OPEN CASES -->
                <div class="kpi-card kpi-open">
                    <div class="kpi-top-bar"></div>
                    <div class="kpi-header">
                        <span class="kpi-label">OPEN CASES</span>
                        <div class="kpi-icon-bubble">
                            <lightning-icon icon-name="utility:clock" size="small"></lightning-icon>
                        </div>
                    </div>
                    <div class="kpi-body">
                        <div class="kpi-number">{metrics.open}</div>
                        <div class="kpi-footer-status">
                            <lightning-icon icon-name="utility:clock" size="x-small"></lightning-icon>
                            <span>Active / In Progress</span>
                        </div>
                    </div>
                </div>

                <!-- CLOSED CASES -->
                <div class="kpi-card kpi-closed">
                    <div class="kpi-top-bar"></div>
                    <div class="kpi-header">
                        <span class="kpi-label">CLOSED CASES</span>
                        <div class="kpi-icon-bubble">
                            <lightning-icon icon-name="utility:check" size="small" variant="success"></lightning-icon>
                        </div>
                    </div>
                    <div class="kpi-body">
                        <div class="kpi-number">{metrics.closed}</div>
                        <div class="kpi-footer-status">
                            <lightning-icon icon-name="utility:check" size="x-small"></lightning-icon>
                            <span>Successfully resolved</span>
                        </div>
                    </div>
                </div>

                <!-- HIGH PRIORITY -->
                <div class="kpi-card kpi-high">
                    <div class="kpi-top-bar"></div>
                    <div class="kpi-header">
                        <span class="kpi-label">HIGH PRIORITY</span>
                        <div class="kpi-icon-bubble">
                            <lightning-icon icon-name="utility:warning" size="small" variant="error"></lightning-icon>
                        </div>
                    </div>
                    <div class="kpi-body">
                        <div class="kpi-number">{metrics.highPriority}</div>
                        <div class="kpi-footer-status">
                            <lightning-icon icon-name="utility:warning" size="x-small"></lightning-icon>
                            <span>Critical SLA attention</span>
                        </div>
                    </div>
                </div>

                <!-- VIP CASES -->
                <div class="kpi-card kpi-vip">
                    <div class="kpi-top-bar"></div>
                    <div class="kpi-header">
                        <span class="kpi-label">VIP CASES</span>
                        <div class="kpi-icon-bubble">
                            <lightning-icon icon-name="utility:favorite" size="small"></lightning-icon>
                        </div>
                    </div>
                    <div class="kpi-body">
                        <div class="kpi-number">{metrics.vip}</div>
                        <div class="kpi-footer-status">
                            <lightning-icon icon-name="utility:favorite" size="x-small"></lightning-icon>
                            <span>Enterprise Tier SLA</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ================= 3-COLUMN × 2-ROW OPERATIONS GRID ================= -->
            <div class="operations-3x2-grid">

                <!-- --------------------------------------------------------------- -->
                <!-- PANEL 1: 1. CASES AUTOMATICALLY CREATED / UPDATED -->
                <!-- --------------------------------------------------------------- -->
                <div class="panel-card panel-1">
                    <div class="panel-header">
                        <div class="panel-header-icon blue">
                            <lightning-icon icon-name="utility:table" size="x-small"></lightning-icon>
                        </div>
                        <div class="panel-header-titles">
                            <h2 class="panel-title">CASE INGESTION & WORKSPACE</h2>
                            <p class="panel-subtitle">Real-time Salesforce cases with search, priority & status filters</p>
                        </div>
                        <span class="panel-badge-count">{metrics.total} Records</span>
                    </div>

                    <!-- Filter Toolbar inside Panel 1 -->
                    <div class="panel-filter-bar">
                        <div class="filter-search-input">
                            <lightning-input
                                type="search"
                                label="Search"
                                variant="label-hidden"
                                placeholder="Search Case #, Subject..."
                                value={searchTerm}
                                onchange={handleSearchChange}>
                            </lightning-input>
                        </div>
                        <div class="filter-dropdown">
                            <lightning-combobox
                                name="priorityFilter"
                                label="Priority"
                                variant="label-hidden"
                                value={priorityFilter}
                                options={priorityOptions}
                                onchange={handlePriorityFilterChange}>
                            </lightning-combobox>
                        </div>
                        <div class="filter-dropdown">
                            <lightning-combobox
                                name="statusFilter"
                                label="Status"
                                variant="label-hidden"
                                value={statusFilter}
                                options={statusOptions}
                                onchange={handleStatusFilterChange}>
                            </lightning-combobox>
                        </div>
                        <lightning-button-icon
                            icon-name="utility:refresh"
                            variant="border-filled"
                            alternative-text="Refresh"
                            title="Refresh"
                            onclick={handleRefresh}>
                        </lightning-button-icon>
                    </div>

                    <!-- Cases Table inside Panel 1 -->
                    <div class="panel-content-scrollable">
                        <template if:true={isLoading}>
                            <div class="panel-spinner">
                                <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
                            </div>
                        </template>

                        <template if:true={hasCases}>
                            <table class="ops-compact-table">
                                <thead>
                                    <tr>
                                        <th>Case #</th>
                                        <th>Subject</th>
                                        <th>Priority</th>
                                        <th>Status</th>
                                        <th>VIP</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={cases} for:item="c">
                                        <tr key={c.Id} class={c.rowClass} data-id={c.Id} data-externalid={c.External_Case_Id__c} onclick={handleSelectCase}>
                                            <td>
                                                <span class="case-number-link">{c.CaseNumber}</span>
                                            </td>
                                            <td>
                                                <span class="table-subject-cell" title={c.Subject}>{c.Subject}</span>
                                            </td>
                                            <td>
                                                <span class={c.priorityBadgeClass}>{c.Priority}</span>
                                            </td>
                                            <td>
                                                <span class={c.statusBadgeClass}>
                                                    <span class="status-dot"></span>
                                                    {c.Status}
                                                </span>
                                            </td>
                                            <td>
                                                <template if:true={c.isVip}>
                                                    <span class="pill-badge badge-vip-gold">★ VIP</span>
                                                </template>
                                                <template if:false={c.isVip}>
                                                    <span class="pill-badge badge-standard">STD</span>
                                                </template>
                                            </td>
                                            <td>
                                                <div class="action-popover-wrapper">
                                                    <button class="btn-actions-trigger" data-id={c.Id} onclick={toggleRowMenu}>
                                                        ▾
                                                    </button>
                                                    <template if:true={c.isMenuOpen}>
                                                        <div class="popover-menu-dropdown">
                                                            <div class="popover-menu-item"
                                                                 data-id={c.Id}
                                                                 data-externalid={c.External_Case_Id__c}
                                                                 data-action="view_details"
                                                                 onclick={handleActionClick}>
                                                                <lightning-icon icon-name="utility:preview" size="x-small"></lightning-icon>
                                                                View Details & Logs
                                                            </div>
                                                            <div class="popover-menu-item"
                                                                 data-id={c.Id}
                                                                 data-action="working_case"
                                                                 onclick={handleActionClick}>
                                                                <lightning-icon icon-name="utility:play" size="x-small"></lightning-icon>
                                                                Set In Progress
                                                            </div>
                                                            <div class="popover-menu-item popover-menu-item-close"
                                                                 data-id={c.Id}
                                                                 data-action="close_case"
                                                                 onclick={handleActionClick}>
                                                                <lightning-icon icon-name="utility:check" size="x-small" variant="error"></lightning-icon>
                                                                Mark Closed
                                                            </div>
                                                        </div>
                                                    </template>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>

                        <template if:false={hasCases}>
                            <template if:false={isLoading}>
                                <div class="empty-panel-box">
                                    <lightning-icon icon-name="utility:search" size="small"></lightning-icon>
                                    <div class="empty-panel-title">No Cases Found</div>
                                    <div class="empty-panel-sub">Try changing search or filter terms.</div>
                                </div>
                            </template>
                        </template>
                    </div>

                    <!-- Panel 1 Dark Blue Footer Bar -->
                    <div class="panel-section-footer">
                        <div class="footer-number">1</div>
                        <span class="footer-title">1. CASES AUTOMATICALLY CREATED / UPDATED</span>
                    </div>
                </div>

                <!-- --------------------------------------------------------------- -->
                <!-- PANEL 2: 2. CASE DETAILS WITH PRIORITY & ASSIGNMENT -->
                <!-- --------------------------------------------------------------- -->
                <div class="panel-card panel-2">
                    <div class="panel-header">
                        <div class="panel-header-icon purple">
                            <lightning-icon icon-name="utility:record" size="x-small"></lightning-icon>
                        </div>
                        <div class="panel-header-titles">
                            <h2 class="panel-title">CASE DETAILS & ASSIGNMENT</h2>
                            <p class="panel-subtitle">Active ticket spotlight, SLA prioritization & assignment rules</p>
                        </div>
                        <template if:true={hasActiveCase}>
                            <span class="panel-case-tag">Case #{activeCaseNumber}</span>
                        </template>
                    </div>

                    <div class="panel-content-scrollable">
                        <template if:true={hasActiveCase}>
                            <!-- Spotlight Case Header Card -->
                            <div class="spotlight-case-card">
                                <div class="spotlight-title-row">
                                    <h3 class="spotlight-subject">{activeCaseSubject}</h3>
                                </div>
                                <div class="spotlight-meta-grid">
                                    <div class="meta-item">
                                        <span class="meta-label">Priority:</span>
                                        <span class={activeCasePriorityBadgeClass}>{activeCasePriority}</span>
                                    </div>
                                    <div class="meta-item">
                                        <span class="meta-label">Status:</span>
                                        <span class={activeCaseStatusBadgeClass}>
                                            <span class="status-dot"></span>
                                            {activeCaseStatus}
                                        </span>
                                    </div>
                                    <div class="meta-item">
                                        <span class="meta-label">Customer Tier:</span>
                                        <template if:true={activeCaseIsVip}>
                                            <span class="pill-badge badge-vip-gold">★ VIP</span>
                                        </template>
                                        <template if:false={activeCaseIsVip}>
                                            <span class="pill-badge badge-standard">Standard</span>
                                        </template>
                                    </div>
                                    <div class="meta-item">
                                        <span class="meta-label">Owner:</span>
                                        <div class="owner-chip">
                                            <span class="avatar-bubble small">{activeCaseOwnerInitials}</span>
                                            <span class="owner-name-truncate">{activeCaseOwnerName}</span>
                                        </div>
                                    </div>
                                    <div class="meta-item full-width">
                                        <span class="meta-label">External Case ID:</span>
                                        <span class="code-badge">{activeCaseExternalId}</span>
                                    </div>
                                    <div class="meta-item full-width">
                                        <span class="meta-label">Description:</span>
                                        <p class="spotlight-description">{activeCaseDescription}</p>
                                    </div>
                                </div>
                            </div>

                            <!-- Smart Case Assignment Rules Section -->
                            <div class="section-sub-header">
                                <lightning-icon icon-name="utility:routing_offline" size="x-small"></lightning-icon>
                                <span>SMART CASE ASSIGNMENT RULES</span>
                            </div>

                            <div class="rules-table-container">
                                <table class="assignment-rules-table">
                                    <thead>
                                        <tr>
                                            <th>Rule Condition</th>
                                            <th>Assigned Queue</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td>
                                                <div class="rule-chips">
                                                    <span class="pill-badge badge-priority-high">HIGH</span>
                                                    <span class="plus-text">+</span>
                                                    <span class="pill-badge badge-vip-gold">★ VIP</span>
                                                </div>
                                            </td>
                                            <td>
                                                <div class="queue-chip queue-vip">
                                                    <lightning-icon icon-name="utility:shield" size="x-small"></lightning-icon>
                                                    <span>VIP Support Queue</span>
                                                </div>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>
                                                <div class="rule-chips">
                                                    <span class="pill-badge badge-priority-high">HIGH</span>
                                                    <span class="plus-text">+</span>
                                                    <span class="pill-badge badge-standard">STD</span>
                                                </div>
                                            </td>
                                            <td>
                                                <div class="queue-chip queue-high">
                                                    <lightning-icon icon-name="utility:warning" size="x-small"></lightning-icon>
                                                    <span>High Priority Queue</span>
                                                </div>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>
                                                <div class="rule-chips">
                                                    <span class="pill-badge badge-priority-low">DEFAULT</span>
                                                    <span class="plus-text">+</span>
                                                    <span class="pill-badge badge-standard">STD</span>
                                                </div>
                                            </td>
                                            <td>
                                                <div class="queue-chip queue-standard">
                                                    <lightning-icon icon-name="utility:groups" size="x-small"></lightning-icon>
                                                    <span>Standard Queue</span>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </template>

                        <template if:false={hasActiveCase}>
                            <div class="empty-panel-box">
                                <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                                <div class="empty-panel-title">No Case Selected</div>
                                <div class="empty-panel-sub">Select a case from Panel 1 to view details.</div>
                            </div>
                        </template>
                    </div>

                    <!-- Panel 2 Dark Blue Footer Bar -->
                    <div class="panel-section-footer">
                        <div class="footer-number">2</div>
                        <span class="footer-title">2. CASE DETAILS WITH PRIORITY & ASSIGNMENT</span>
                    </div>
                </div>

                <!-- --------------------------------------------------------------- -->
                <!-- PANEL 3: 3. EXTERNAL API INTEGRATION -->
                <!-- --------------------------------------------------------------- -->
                <div class="panel-card panel-3">
                    <div class="panel-header">
                        <div class="panel-header-icon green">
                            <lightning-icon icon-name="utility:connected_apps" size="x-small"></lightning-icon>
                        </div>
                        <div class="panel-header-titles">
                            <h2 class="panel-title">EXTERNAL API INTEGRATION</h2>
                            <p class="panel-subtitle">Customer REST API enrichment & real integration logs</p>
                        </div>
                        <span class="panel-status-pill">
                            <span class="green-dot"></span> Active
                        </span>
                    </div>

                    <div class="panel-content-scrollable">
                        <template if:true={hasActiveCase}>
                            <!-- Customer Profile Sub-card -->
                            <div class="customer-profile-card">
                                <div class="customer-profile-top">
                                    <div class="customer-avatar-icon">
                                        <lightning-icon icon-name="utility:user" size="x-small"></lightning-icon>
                                    </div>
                                    <div class="customer-profile-name-group">
                                        <div class="customer-fullname">{activeCaseCustomerName}</div>
                                        <div class="customer-id-text">ID: {activeCaseCustomerId}</div>
                                    </div>
                                    <div class="customer-tier-tag">
                                        <template if:true={activeCaseIsVip}>
                                            <span class="pill-badge badge-vip-gold">★ VIP Client</span>
                                        </template>
                                        <template if:false={activeCaseIsVip}>
                                            <span class="pill-badge badge-standard">Standard Client</span>
                                        </template>
                                    </div>
                                </div>
                                <div class="customer-detail-list">
                                    <div class="customer-detail-row">
                                        <span class="detail-label">Email:</span>
                                        <span class="detail-val">{activeCaseCustomerEmail}</span>
                                    </div>
                                    <div class="customer-detail-row">
                                        <span class="detail-label">Phone:</span>
                                        <span class="detail-val">{activeCaseCustomerPhone}</span>
                                    </div>
                                    <div class="customer-detail-row">
                                        <span class="detail-label">Account:</span>
                                        <span class="detail-val font-semibold">{activeCaseAccountName}</span>
                                    </div>
                                    <div class="customer-detail-row">
                                        <span class="detail-label">Status:</span>
                                        <span class="detail-val text-success font-semibold">Active Profile</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Integration Logs Timeline Sub-card -->
                            <div class="section-sub-header">
                                <lightning-icon icon-name="utility:record_lookup" size="x-small"></lightning-icon>
                                <span>INTEGRATION LOG ACTIVITY</span>
                            </div>

                            <template if:true={hasActiveLogs}>
                                <div class="compact-logs-list">
                                    <template for:each={formattedActiveLogs} for:item="log">
                                        <div key={log.Id} class="compact-log-item">
                                            <div class={log.timelineIconClass}>
                                                <lightning-icon icon-name={log.iconName} size="xx-small"></lightning-icon>
                                            </div>
                                            <div class="compact-log-body">
                                                <div class="log-title-bar">
                                                    <span class="log-svc-name">{log.Service_Name__c}</span>
                                                    <span class={log.timelineBadgeClass}>{log.statusBadgeText}</span>
                                                </div>
                                                <template if:true={log.errorMessage}>
                                                    <div class="log-err-msg">{log.errorMessage}</div>
                                                </template>
                                                <div class="log-meta-foot">
                                                    <span>{log.Name}</span> • <span>{log.executionTime}</span> • <span>{log.formattedDate}</span>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <template if:false={hasActiveLogs}>
                                <div class="empty-panel-box mini">
                                    <lightning-icon icon-name="utility:connected_apps" size="x-small"></lightning-icon>
                                    <div class="empty-panel-title">No Integration Activity</div>
                                    <div class="empty-panel-sub">No API events logged for this external case ID.</div>
                                </div>
                            </template>
                        </template>

                        <template if:false={hasActiveCase}>
                            <div class="empty-panel-box">
                                <lightning-icon icon-name="utility:connected_apps" size="small"></lightning-icon>
                                <div class="empty-panel-title">No Case Selected</div>
                                <div class="empty-panel-sub">Select a case from Panel 1 to view integration details.</div>
                            </div>
                        </template>
                    </div>

                    <!-- Panel 3 Dark Blue Footer Bar -->
                    <div class="panel-section-footer">
                        <div class="footer-number">3</div>
                        <span class="footer-title">3. EXTERNAL API INTEGRATION</span>
                    </div>
                </div>

                <!-- --------------------------------------------------------------- -->
                <!-- PANEL 4: 4. AUTOMATION WITH APEX / QUEUEABLE -->
                <!-- --------------------------------------------------------------- -->
                <div class="panel-card panel-4">
                    <div class="panel-header">
                        <div class="panel-header-icon orange">
                            <lightning-icon icon-name="utility:process" size="x-small"></lightning-icon>
                        </div>
                        <div class="panel-header-titles">
                            <h2 class="panel-title">AUTOMATION & ARCHITECTURE</h2>
                            <p class="panel-subtitle">Asynchronous ingestion pipeline & resilient error handling</p>
                        </div>
                        <span class="panel-status-pill">
                            <span class="green-dot"></span> Queueable Active
                        </span>
                    </div>

                    <div class="panel-content-scrollable">
                        <!-- Ingestion Workflow Pipeline -->
                        <div class="section-sub-header">
                            <lightning-icon icon-name="utility:flow" size="x-small"></lightning-icon>
                            <span>INGESTION WORKFLOW PIPELINE</span>
                        </div>

                        <div class="automation-step-list">
                            <div class="auto-step">
                                <div class="step-num">1</div>
                                <div class="step-details">
                                    <div class="step-name">Case Received (External REST)</div>
                                    <div class="step-sub">Dispatched via JSON payload to /services/apexrest/cases/v1</div>
                                </div>
                            </div>
                            <div class="auto-arrow">↓</div>

                            <div class="auto-step">
                                <div class="step-num">2</div>
                                <div class="step-details">
                                    <div class="step-name">Request Validation & Staging</div>
                                    <div class="step-sub">Creates durable External_Case__c staging record</div>
                                </div>
                            </div>
                            <div class="auto-arrow">↓</div>

                            <div class="auto-step">
                                <div class="step-num">3</div>
                                <div class="step-details">
                                    <div class="step-name">Queueable Apex Ingestion</div>
                                    <div class="step-sub">Enqueues CaseProcessingQueueable for async execution</div>
                                </div>
                            </div>
                            <div class="auto-arrow">↓</div>

                            <div class="auto-step">
                                <div class="step-num">4</div>
                                <div class="step-details">
                                    <div class="step-name">Customer API Callout & Matching</div>
                                    <div class="step-sub">Queries Customer_API Named Credential to enrich VIP & Account/Contact</div>
                                </div>
                            </div>
                            <div class="auto-arrow">↓</div>

                            <div class="auto-step">
                                <div class="step-num">5</div>
                                <div class="step-details">
                                    <div class="step-name">Salesforce Case & Smart Assignment</div>
                                    <div class="step-sub">Inserts/updates Case and routes to VIP, High, or Standard queue</div>
                                </div>
                            </div>
                        </div>

                        <!-- Error Handling Pipeline -->
                        <div class="section-sub-header">
                            <lightning-icon icon-name="utility:error" size="x-small"></lightning-icon>
                            <span>AUTOMATED ERROR HANDLING FLOW</span>
                        </div>

                        <div class="error-handling-card">
                            <div class="error-flow-row">
                                <div class="error-node">Integration Error</div>
                                <div class="error-arrow">➔</div>
                                <div class="error-node">Error Captured</div>
                                <div class="error-arrow">➔</div>
                                <div class="error-node">Log Created</div>
                            </div>
                            <div class="error-flow-row">
                                <div class="error-node">External Case Failed</div>
                                <div class="error-arrow">➔</div>
                                <div class="error-node highlight">Visible in Support Dashboard</div>
                            </div>
                        </div>
                    </div>

                    <!-- Panel 4 Dark Blue Footer Bar -->
                    <div class="panel-section-footer">
                        <div class="footer-number">4</div>
                        <span class="footer-title">4. AUTOMATION WITH APEX / QUEUEABLE</span>
                    </div>
                </div>

                <!-- --------------------------------------------------------------- -->
                <!-- PANEL 5: 5. CUSTOMER SUPPORT ACTIVITY -->
                <!-- --------------------------------------------------------------- -->
                <div class="panel-card panel-5">
                    <div class="panel-header">
                        <div class="panel-header-icon teal">

                                <div class="resolution-box success">

                                        <span class="res-check-tag">✓ CASE RESOLVED</span>

                                    </div>
                                    <div class="res-box-content">

                                            <span class="res-label">Resolution Summary:</span>
                                            <span class="res-val-summary">{activeCaseResolutionSummary}</span>
                                        </div>
                                        <div class="res-field">
                                            <span class="res-label">Resolution Notes:</span>
                                            <span class="res-val-notes">{activeCaseResolutionNotes}</span>

                                                <lightning-icon icon-name={act.iconName} size="x-small"></lightning-icon>

                                            <div class="activity-item-content">

                                                </div>

                                    <div class="empty-panel-sub">No activities recorded for this Case.</div>
                                </div>
                            </template>
                        </template>

                        <template if:false={hasActiveCase}>
                            <div class="empty-panel-box">
                                <lightning-icon icon-name="utility:task" size="small"></lightning-icon>
                                <div class="empty-panel-title">No Case Selected</div>
                                <div class="empty-panel-sub">Select a case from Panel 1 to view activities and resolution.</div>
                            </div>

                    </div>

                    <!-- Panel 5 Dark Blue Footer Bar -->
                    <div class="panel-section-footer">
                        <div class="footer-number">5</div>
                        <span class="footer-title">5. CUSTOMER SUPPORT ACTIVITY</span>
                    </div>
                </div>

                <!-- --------------------------------------------------------------- -->
                <!-- PANEL 6: 6. DASHBOARD & REPORTING -->
                <!-- --------------------------------------------------------------- -->
                <div class="panel-card panel-6">
                    <div class="panel-header">
                        <div class="panel-header-icon navy">
                            <lightning-icon icon-name="utility:chart" size="x-small"></lightning-icon>
                        </div>
                        <div class="panel-header-titles">
                            <h2 class="panel-title">DASHBOARD & REPORTING</h2>
                            <p class="panel-subtitle">Live ticket distributions, SLA metrics & system health telemetry</p>
                        </div>
                        <span class="panel-status-pill">
                            <span class="green-dot"></span> Live Telemetry
                        </span>
                    </div>

                    <div class="panel-content-scrollable">
                        <!-- Priority Distribution Bars -->
                        <div class="section-sub-header">
                            <lightning-icon icon-name="utility:priority" size="x-small"></lightning-icon>
                            <span>CASES BY PRIORITY</span>
                        </div>

                        <div class="distribution-group">
                            <div class="dist-row">
                                <div class="dist-info">
                                    <span class="dist-name">High Priority</span>
                                    <span class="dist-val">{priorityDistribution.highCount} ({priorityDistribution.highPercent}%)</span>
                                </div>
                                <div class="dist-bar-track">
                                    <div class="dist-bar-fill high" style={priorityDistribution.highStyle}></div>
                                </div>
                            </div>

                            <div class="dist-row">
                                <div class="dist-info">
                                    <span class="dist-name">Medium Priority</span>
                                    <span class="dist-val">{priorityDistribution.mediumCount} ({priorityDistribution.mediumPercent}%)</span>
                                </div>
                                <div class="dist-bar-track">
                                    <div class="dist-bar-fill medium" style={priorityDistribution.mediumStyle}></div>
                                </div>
                            </div>

                            <div class="dist-row">
                                <div class="dist-info">
                                    <span class="dist-name">Low Priority</span>
                                    <span class="dist-val">{priorityDistribution.lowCount} ({priorityDistribution.lowPercent}%)</span>
                                </div>
                                <div class="dist-bar-track">
                                    <div class="dist-bar-fill low" style={priorityDistribution.lowStyle}></div>
                                </div>
                            </div>
                        </div>

                        <!-- Status Distribution Bars -->
                        <div class="section-sub-header">

                            <span>CASES BY STATUS</span>
                        </div>

                        <div class="distribution-group">
                            <div class="dist-row">
                                <div class="dist-info">
                                    <span class="dist-name">New Tickets</span>
                                    <span class="dist-val">{statusDistribution.newCount} ({statusDistribution.newPercent}%)</span>
                                </div>
                                <div class="dist-bar-track">
                                    <div class="dist-bar-fill status-new" style={statusDistribution.newStyle}></div>
                                </div>
                            </div>

                            <div class="dist-row">
                                <div class="dist-info">
                                    <span class="dist-name">Working / In Progress</span>
                                    <span class="dist-val">{statusDistribution.workingCount} ({statusDistribution.workingPercent}%)</span>
                                </div>
                                <div class="dist-bar-track">
                                    <div class="dist-bar-fill status-working" style={statusDistribution.workingStyle}></div>
                                </div>
                            </div>

                            <div class="dist-row">
                                <div class="dist-info">
                                    <span class="dist-name">Closed & Resolved</span>
                                    <span class="dist-val">{statusDistribution.closedCount} ({statusDistribution.closedPercent}%)</span>
                                </div>
                                <div class="dist-bar-track">
                                    <div class="dist-bar-fill status-closed" style={statusDistribution.closedStyle}></div>
                                </div>
                            </div>
                        </div>

                        <!-- System Health Grid -->
                        <div class="section-sub-header">
                            <lightning-icon icon-name="utility:shield" size="x-small"></lightning-icon>
                            <span>PLATFORM HEALTH & AUTOMATION TELEMETRY</span>
                        </div>

                        <div class="health-telemetry-grid">
                            <div class="health-card">
                                <span class="health-led green"></span>
                                <div class="health-card-body">
                                    <div class="health-card-title">Apex REST API</div>
                                    <div class="health-card-sub">Online & Listening</div>
                                </div>
                            </div>
                            <div class="health-card">
                                <span class="health-led green"></span>
                                <div class="health-card-body">
                                    <div class="health-card-title">Queueable Engine</div>
                                    <div class="health-card-sub">Workers Active</div>
                                </div>
                            </div>
                            <div class="health-card">
                                <span class="health-led green"></span>
                                <div class="health-card-body">
                                    <div class="health-card-title">Customer API Callout</div>
                                    <div class="health-card-sub">Named Credential Active</div>
                                </div>
                            </div>
                            <div class="health-card">
                                <span class="health-led green"></span>
                                <div class="health-card-body">
                                    <div class="health-card-title">Apex Local Tests</div>
                                    <div class="health-card-sub">100% Pass Rate</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Panel 6 Dark Blue Footer Bar -->
                    <div class="panel-section-footer">
                        <div class="footer-number">6</div>
                        <span class="footer-title">6. DASHBOARD & REPORTING</span>
                    </div>
                </div>

            </div>

            <!-- ================= BOTTOM FEATURE STRIP (6 CARDS) ================= -->
            <div class="feature-strip-container">
                <div class="feature-strip-card">
                    <div class="feature-icon">⚙</div>
                    <div class="feature-content">
                        <div class="feature-title">Automated Case Management</div>
                        <div class="feature-sub">Automatically processes support cases</div>
                    </div>
                </div>

                <div class="feature-strip-card">
                    <div class="feature-icon">🔗</div>
                    <div class="feature-content">
                        <div class="feature-title">External System Integration</div>
                        <div class="feature-sub">Enriches data from external Customer API</div>
                    </div>
                </div>

                <div class="feature-strip-card">
                    <div class="feature-icon">👥</div>
                    <div class="feature-content">
                        <div class="feature-title">Smart Case Assignment</div>
                        <div class="feature-sub">Routes cases by priority and VIP status</div>
                    </div>
                </div>

                <div class="feature-strip-card">
                    <div class="feature-icon">📝</div>
                    <div class="feature-content">
                        <div class="feature-title">Case Resolution Tracking</div>
                        <div class="feature-sub">Requires resolution details before closing</div>
                    </div>
                </div>

                <div class="feature-strip-card">
                    <div class="feature-icon">📋</div>
                    <div class="feature-content">
                        <div class="feature-title">Error Handling & Logging</div>
                        <div class="feature-sub">Tracks API events and HTTP diagnostics</div>
                    </div>
                </div>

                <div class="feature-strip-card">
                    <div class="feature-icon">✓</div>
                    <div class="feature-content">
                        <div class="feature-title">Apex Automated Testing</div>
                        <div class="feature-sub">High Apex coverage and strict validation</div>
                    </div>
                </div>
            </div>

            <!-- ================= MODAL: VIEW DETAILS & LOGS ================= -->
            <template if:true={isModalOpen}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open case-details-modal-override" aria-labelledby="modal-heading-01" aria-modal="true">
                    <div class="slds-modal__container modal-container-wide">
                        <header class="modal-hero-header slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                                <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                                <span class="slds-assistive-text">Close</span>
                            </button>
                            <div class="modal-header-content">
                                <div class="modal-header-top">
                                    <div class="modal-case-badge">
                                        <lightning-icon icon-name="standard:case" size="small" variant="inverse"></lightning-icon>
                                        <span class="modal-case-number">CASE #{selectedCase.CaseNumber}</span>
                                    </div>
                                    <div class="modal-header-badges">
                                        <span class={selectedCasePriorityBadgeClass}>{selectedCase.Priority}</span>
                                        <span class={selectedCaseStatusBadgeClass}>
                                            <span class="status-dot"></span>
                                            {selectedCase.Status}
                                        </span>
                                    </div>
                                </div>
                                <h2 id="modal-heading-01" class="modal-subject-title">
                                    {selectedCase.Subject}
                                </h2>
                            </div>
                        </header>
                        <div class="slds-modal__content modal-body-custom" id="modal-content-id-1">
                            <lightning-tabset class="custom-modal-tabset">
                                <!-- Tab 1: Case Overview -->
                                <lightning-tab label="Overview">
                                    <div class="modal-tab-content">
                                        <div class="modal-section-label">
                                            <lightning-icon icon-name="utility:summary" size="x-small" class="section-icon"></lightning-icon>
                                            <span>CASE SUMMARY</span>
                                        </div>

                                        <div class="summary-cards-grid">
                                            <div class="summary-card">
                                                <div class="summary-card-header">
                                                    <lightning-icon icon-name="utility:priority" size="x-small"></lightning-icon>
                                                    <span>Priority</span>
                                                </div>
                                                <div class="summary-card-body">
                                                    <span class={selectedCasePriorityBadgeClass}>{selectedCase.Priority}</span>
                                                </div>
                                            </div>

                                            <div class="summary-card">
                                                <div class="summary-card-header">
                                                    <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
                                                    <span>Status</span>
                                                </div>
                                                <div class="summary-card-body">
                                                    <span class={selectedCaseStatusBadgeClass}>
                                                        <span class="status-dot"></span>
                                                        {selectedCase.Status}
                                                    </span>
                                                </div>
                                            </div>

                                            <div class="summary-card">
                                                <div class="summary-card-header">
                                                    <lightning-icon icon-name="utility:user" size="x-small"></lightning-icon>
                                                    <span>Customer Type</span>
                                                </div>
                                                <div class="summary-card-body">
                                                    <template if:true={selectedCase.Is_VIP__c}>
                                                        <span class="pill-badge badge-vip-gold">★ VIP CUSTOMER</span>
                                                    </template>
                                                    <template if:false={selectedCase.Is_VIP__c}>
                                                        <span class="pill-badge badge-standard">Standard Customer</span>
                                                    </template>
                                                </div>
                                            </div>

                                            <div class="summary-card">
                                                <div class="summary-card-header">
                                                    <lightning-icon icon-name="utility:identity" size="x-small"></lightning-icon>
                                                    <span>Owner</span>
                                                </div>
                                                <div class="summary-card-body">
                                                    <div class="owner-pill">
                                                        <div class="avatar-bubble">{selectedCaseOwnerInitials}</div>
                                                        <span class="owner-name-text">{selectedCaseOwnerName}</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="summary-card">
                                                <div class="summary-card-header">
                                                    <lightning-icon icon-name="utility:fulfillment_order" size="x-small"></lightning-icon>
                                                    <span>External Case ID</span>
                                                </div>
                                                <div class="summary-card-body">
                                                    <span class="external-id-value">{selectedCaseExternalIdFormatted}</span>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="modal-section">
                                            <div class="modal-section-label">
                                                <lightning-icon icon-name="utility:description" size="x-small" class="section-icon"></lightning-icon>
                                                <span>DESCRIPTION</span>
                                            </div>
                                            <div class="description-card-box">
                                                <p>{selectedCaseDescriptionFormatted}</p>
                                            </div>
                                        </div>

                                        <div class="modal-section">
                                            <div class="modal-section-label resolution-header-label">
                                                <lightning-icon icon-name="utility:check" size="x-small" class="section-icon"></lightning-icon>
                                                <span>✓ CASE RESOLVED</span>
                                            </div>
                                            <template if:true={isCaseClosed}>

                                                        <span class="resolution-check-badge">✓ Case Resolved</span>
                                                    </div>
                                                    <div class="resolution-card-grid">
                                                        <div class="resolution-field-item full-width">
                                                            <div class="resolution-field-label">Resolution</div>
                                                            <div class="resolution-field-value-summary">{selectedCaseResolutionSummary}</div>
                                                        </div>
                                                        <div class="resolution-field-item full-width">
                                                            <div class="resolution-field-label">Resolution Notes</div>
                                                            <div class="resolution-field-value-notes">{selectedCaseResolutionNotes}</div>
                                                        </div>
                                                        <div class="resolution-field-item">
                                                            <div class="resolution-field-label">Resolved By</div>
                                                            <div class="resolution-field-value-user">
                                                                <lightning-icon icon-name="utility:user" size="x-small" class="inline-res-icon"></lightning-icon>
                                                                <span>{selectedCaseResolvedByName}</span>
                                                            </div>
                                                        </div>
                                                        <div class="resolution-field-item">
                                                            <div class="resolution-field-label">Resolved Date</div>
                                                            <div class="resolution-field-value-date">
                                                                <lightning-icon icon-name="utility:event" size="x-small" class="inline-res-icon"></lightning-icon>
                                                                <span>{selectedCaseResolvedDateFormatted}</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>
                                            <template if:false={isCaseClosed}>
                                                <div class="resolution-card-box empty-resolution">
                                                    <div class="empty-resolution-content">
                                                        <lightning-icon icon-name="utility:info_alt" size="x-small"></lightning-icon>
                                                        <span>No resolution recorded yet.</span>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </lightning-tab>

                                <!-- Tab 2: Customer Details -->
                                <lightning-tab label="Customer Details">
                                    <div class="modal-tab-content">
                                        <div class="modal-section-label">
                                            <lightning-icon icon-name="utility:people" size="x-small" class="section-icon"></lightning-icon>
                                            <span>CUSTOMER PROFILE</span>
                                        </div>
                                        <div class="customer-info-box">
                                            <div class="customer-grid">
                                                <div class="customer-item">
                                                    <span class="customer-label">Customer ID</span>
                                                    <span class="customer-value font-mono">{selectedCaseCustomerId}</span>
                                                </div>
                                                <div class="customer-item">
                                                    <span class="customer-label">Customer Name</span>
                                                    <span class="customer-value font-bold">{selectedCaseCustomerName}</span>
                                                </div>
                                                <div class="customer-item">
                                                    <span class="customer-label">Email</span>
                                                    <span class="customer-value">{selectedCaseCustomerEmail}</span>
                                                </div>
                                                <div class="customer-item">
                                                    <span class="customer-label">Phone</span>
                                                    <span class="customer-value">{selectedCaseCustomerPhone}</span>
                                                </div>
                                                <div class="customer-item">
                                                    <span class="customer-label">Company / Account</span>
                                                    <span class="customer-value">{selectedCaseAccountName}</span>
                                                </div>
                                                <div class="customer-item">
                                                    <span class="customer-label">Customer Status</span>
                                                    <span class="customer-value font-bold text-success">Active Customer</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </lightning-tab>

                                <!-- Tab 3: Activities -->
                                <lightning-tab label="Activities">

                                        <div class="modal-section-label">

                                            <span>CASE ACTIVITIES & TASKS</span>
                                        </div>
                                        <template if:true={hasModalActivities}>
                                            <div class="timeline-container">
                                                <template for:each={formattedModalActivities} for:item="act">
                                                    <div key={act.Id} class="timeline-item">
                                                        <div class="timeline-status-icon success">
                                                            <lightning-icon icon-name={act.iconName} size="x-small"></lightning-icon>
                                                        </div>
                                                        <div class="timeline-content">
                                                            <div class="timeline-title-row">
                                                                <span class="timeline-service-name">{act.Subject}</span>

                                                </template>

                                        </div>

                                            <div class="timeline-container">

                                                            <lightning-icon icon-name={log.iconName} size="x-small"></lightning-icon>
                                                        </div>

                                    </div>

                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

            <!-- ================= MODAL: CLOSE CASE RESOLUTION PROMPT ================= -->
            <template if:true={isCloseModalOpen}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open" aria-labelledby="modal-heading-02" aria-modal="true">
                    <div class="slds-modal__container">
                        <header class="modal-hero-header slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeCloseModal}>
                                <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                                <span class="slds-assistive-text">Close</span>
                            </button>
                            <h2 id="modal-heading-02" class="slds-modal__title slds-hyphenate">
                                Close Case
                            </h2>
                            <p class="modal-hero-subtitle">Document how the customer's issue was resolved.</p>
                        </header>
                        <div class="slds-modal__content slds-var-p-around_large" id="modal-content-id-2">
                            <lightning-input
                                name="resolutionSummary"
                                label="Resolution Summary"
                                placeholder="Brief summary of resolution..."
                                value={resolutionSummaryInput}
                                onchange={handleResolutionSummaryChange}
                                required
                                class="slds-var-m-bottom_small">
                            </lightning-input>
                            <lightning-textarea
                                name="resolutionNotes"
                                label="Resolution Notes"
                                placeholder="Describe how the customer's issue was resolved..."
                                value={resolutionNotesInput}
                                onchange={handleResolutionNotesChange}
                                required
                                class="slds-var-m-bottom_small">
                            </lightning-textarea>
                        </div>
                        <footer class="slds-modal__footer">
                            <lightning-button label="Cancel" variant="neutral" onclick={closeCloseModal} class="slds-var-m-right_x-small"></lightning-button>
                            <lightning-button label="Close Case" variant="brand" onclick={confirmCloseCase}></lightning-button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

        </div>
    </div>
</template>
