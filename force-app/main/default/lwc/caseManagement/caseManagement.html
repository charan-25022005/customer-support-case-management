<template>
    <div class="app-wrapper" onclick={closeAllRowMenus}>
        <div class="app-container">

            <!-- ================= TOP BLUE BANNER ================= -->
            <header class="top-blue-banner">
                <div class="banner-left">
                    <div class="sf-logo-icon">
                        <lightning-icon icon-name="standard:case" size="medium" variant="inverse"></lightning-icon>
                    </div>
                    <div class="banner-titles">
                        <h1 class="banner-main-title">Customer Support Case Management</h1>
                        <p class="banner-subtitle">Automated | Integrated | Intelligent | Customer Centric</p>
                    </div>
                </div>
                <div class="banner-right">
                    <div class="hackathon-card">
                        <div class="hackathon-title">CTS Hackathon</div>
                        <div class="hackathon-meta">Team Size: 5 | Duration: 2 Days</div>
                    </div>
                </div>
            </header>

            <!-- ================= 3-COLUMN × 2-ROW OPERATIONS GRID ================= -->
            <div class="operations-grid">

                <!-- --------------------------------------------------------------- -->
                <!-- ROW 1 / PANEL 1: 1. CASES AUTOMATICALLY CREATED/UPDATED -->
                <!-- --------------------------------------------------------------- -->
                <div class="panel-box panel-1">
                    <div class="panel-header">
                        <h2 class="panel-header-title">1. CASES AUTOMATICALLY CREATED/UPDATED</h2>
                        <p class="panel-header-subtitle">Cases received from external systems and managed in Salesforce</p>
                    </div>

                    <!-- Filter Toolbar -->
                    <div class="panel-toolbar">
                        <div class="tb-search">
                            <lightning-input
                                type="search"
                                label="Search"
                                variant="label-hidden"
                                placeholder="Search Cases..."
                                value={searchTerm}
                                onchange={handleSearchChange}>
                            </lightning-input>
                        </div>
                        <div class="tb-dropdown">
                            <lightning-combobox
                                name="priorityFilter"
                                label="Priority"
                                variant="label-hidden"
                                value={priorityFilter}
                                options={priorityOptions}
                                onchange={handlePriorityFilterChange}>
                            </lightning-combobox>
                        </div>
                        <div class="tb-dropdown">
                            <lightning-combobox
                                name="statusFilter"
                                label="Status"
                                variant="label-hidden"
                                value={statusFilter}
                                options={statusOptions}
                                onchange={handleStatusFilterChange}>
                            </lightning-combobox>
                        </div>
                        <div class="tb-refresh">
                            <lightning-button-icon
                                icon-name="utility:refresh"
                                variant="border-filled"
                                alternative-text="Refresh"
                                title="Refresh"
                                onclick={handleRefresh}>
                            </lightning-button-icon>
                        </div>
                    </div>

                    <!-- Panel 1 Table Content -->
                    <div class="panel-body">
                        <template if:true={isLoading}>
                            <div class="loading-box">
                                <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
                            </div>
                        </template>

                        <template if:true={hasCases}>
                            <table class="grid-table">
                                <thead>
                                    <tr>
                                        <th>Case Number</th>
                                        <th>Subject</th>
                                        <th>Priority</th>
                                        <th>Status</th>
                                        <th>Owner</th>
                                        <th style="text-align:right;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={cases} for:item="c">
                                        <tr key={c.Id} class={c.rowClass} data-id={c.Id} data-externalid={c.External_Case_Id__c} onclick={handleSelectCase}>
                                            <td>
                                                <span class="case-number-text">{c.CaseNumber}</span>
                                            </td>
                                            <td>
                                                <span class="case-subject-text" title={c.Subject}>{c.Subject}</span>
                                            </td>
                                            <td>
                                                <span class={c.priorityBadgeClass}>{c.Priority}</span>
                                            </td>
                                            <td>
                                                <span class={c.statusBadgeClass}>
                                                    <span class="status-dot"></span>
                                                    {c.Status}
                                                </span>
                                            </td>
                                            <td>
                                                <span class="case-owner-text" title={c.OwnerName}>{c.OwnerName}</span>
                                            </td>
                                            <td style="text-align:right;">
                                                <div class="action-dropdown-wrapper">
                                                    <button class="action-btn-trigger" data-id={c.Id} onclick={toggleRowMenu}>
                                                        Actions ▾
                                                    </button>
                                                    <template if:true={c.isMenuOpen}>
                                                        <div class="action-menu-popup">
                                                            <div class="menu-item"
                                                                 data-id={c.Id}
                                                                 data-externalid={c.External_Case_Id__c}
                                                                 data-action="view_details"
                                                                 onclick={handleActionClick}>
                                                                <lightning-icon icon-name="utility:preview" size="x-small"></lightning-icon>
                                                                View Details & Logs
                                                            </div>
                                                            <div class="menu-item"
                                                                 data-id={c.Id}
                                                                 data-action="working_case"
                                                                 onclick={handleActionClick}>
                                                                <lightning-icon icon-name="utility:play" size="x-small"></lightning-icon>
                                                                Set to In Progress
                                                            </div>
                                                            <div class="menu-item menu-item-danger"
                                                                 data-id={c.Id}
                                                                 data-action="close_case"
                                                                 onclick={handleActionClick}>
                                                                <lightning-icon icon-name="utility:check" size="x-small" variant="error"></lightning-icon>
                                                                Mark as Closed
                                                            </div>
                                                        </div>
                                                    </template>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>

                        <template if:false={hasCases}>
                            <template if:false={isLoading}>
                                <div class="empty-state-box">
                                    <lightning-icon icon-name="utility:search" size="small"></lightning-icon>
                                    <div class="empty-state-title">No Cases Found</div>
                                    <div class="empty-state-sub">Adjust your search or filter options.</div>
                                </div>
                            </template>
                        </template>
                    </div>

                    <!-- Panel 1 Dark Blue Footer Bar -->
                    <div class="panel-footer-bar">
                        <div class="footer-title">1. Cases Automatically Created/Updated</div>
                        <div class="footer-subtitle">Cases received from external systems and managed in Salesforce</div>
                    </div>
                </div>

                <!-- --------------------------------------------------------------- -->
                <!-- ROW 1 / PANEL 2: 2. CASE DETAILS WITH PRIORITY & ASSIGNMENT -->
                <!-- --------------------------------------------------------------- -->
                <div class="panel-box panel-2">
                    <div class="panel-header">
                        <h2 class="panel-header-title">2. CASE DETAILS WITH PRIORITY & ASSIGNMENT</h2>
                        <p class="panel-header-subtitle">Auto-assignment based on priority and customer information</p>
                    </div>

                    <div class="panel-body">
                        <template if:true={hasActiveCase}>
                            <!-- Case Details Card -->
                            <div class="info-card">
                                <div class="case-detail-heading-row">
                                    <span class="detail-case-badge">Case #{activeCaseNumber}</span>
                                    <span class={activeCaseStatusBadgeClass}>
                                        <span class="status-dot"></span>
                                        {activeCaseStatus}
                                    </span>
                                </div>
                                <h3 class="detail-subject-title">{activeCaseSubject}</h3>

                                <div class="kv-grid">
                                    <div class="kv-col">
                                        <span class="kv-label">Priority</span>
                                        <span class={activeCasePriorityBadgeClass}>{activeCasePriority}</span>
                                    </div>
                                    <div class="kv-col">
                                        <span class="kv-label">Customer Tier</span>
                                        <template if:true={activeCaseIsVip}>
                                            <span class="badge-vip-gold">★ VIP Customer</span>
                                        </template>
                                        <template if:false={activeCaseIsVip}>
                                            <span class="badge-standard">Standard Customer</span>
                                        </template>
                                    </div>
                                    <div class="kv-col">
                                        <span class="kv-label">Owner</span>
                                        <span class="kv-value font-bold">{activeCaseOwnerName}</span>
                                    </div>
                                    <div class="kv-col">
                                        <span class="kv-label">External Case ID</span>
                                        <span class="kv-value font-mono">{activeCaseExternalId}</span>
                                    </div>
                                    <div class="kv-col full-span">
                                        <span class="kv-label">Description</span>
                                        <p class="kv-desc-text">{activeCaseDescription}</p>
                                    </div>
                                </div>
                            </div>

                            <!-- Auto-Assignment Routing Matrix -->
                            <div class="section-title-strip">
                                <lightning-icon icon-name="utility:routing_offline" size="x-small"></lightning-icon>
                                <span>SMART AUTO-ASSIGNMENT RULES</span>
                            </div>

                            <div class="routing-matrix">
                                <div class="routing-row">
                                    <div class="routing-condition">
                                        <span class="badge-priority-high">HIGH</span>
                                        <span class="routing-plus">+</span>
                                        <span class="badge-vip-gold">★ VIP</span>
                                    </div>
                                    <span class="routing-arrow">➔</span>
                                    <div class="routing-target queue-vip">
                                        <lightning-icon icon-name="utility:shield" size="xx-small"></lightning-icon>
                                        <span>VIP Support Queue</span>
                                    </div>
                                </div>
                                <div class="routing-row">
                                    <div class="routing-condition">
                                        <span class="badge-priority-high">HIGH</span>
                                        <span class="routing-plus">+</span>
                                        <span class="badge-standard">STANDARD</span>
                                    </div>
                                    <span class="routing-arrow">➔</span>
                                    <div class="routing-target queue-high">
                                        <lightning-icon icon-name="utility:warning" size="xx-small"></lightning-icon>
                                        <span>High Priority Support Queue</span>
                                    </div>
                                </div>
                                <div class="routing-row">
                                    <div class="routing-condition">
                                        <span class="badge-priority-low">DEFAULT</span>
                                        <span class="routing-plus">+</span>
                                        <span class="badge-standard">STANDARD</span>
                                    </div>
                                    <span class="routing-arrow">➔</span>
                                    <div class="routing-target queue-standard">
                                        <lightning-icon icon-name="utility:groups" size="xx-small"></lightning-icon>
                                        <span>Standard Support Queue</span>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <template if:false={hasActiveCase}>
                            <div class="empty-state-box">
                                <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                                <div class="empty-state-title">No Case Selected</div>
                                <div class="empty-state-sub">Select a case from Panel 1 to inspect details.</div>
                            </div>
                        </template>
                    </div>

                    <!-- Panel 2 Dark Blue Footer Bar -->
                    <div class="panel-footer-bar">
                        <div class="footer-title">2. Case Details with Priority & Assignment</div>
                        <div class="footer-subtitle">Auto-assignment based on priority and customer information</div>
                    </div>
                </div>

                <!-- --------------------------------------------------------------- -->
                <!-- ROW 1 / PANEL 3: 3. EXTERNAL API INTEGRATION -->
                <!-- --------------------------------------------------------------- -->
                <div class="panel-box panel-3">
                    <div class="panel-header">
                        <h2 class="panel-header-title">3. EXTERNAL API INTEGRATION</h2>
                        <p class="panel-header-subtitle">Customer details retrieved and exceptions handled</p>
                    </div>

                    <div class="panel-body">
                        <template if:true={hasActiveCase}>
                            <!-- Customer Details Section -->
                            <div class="section-title-strip">
                                <lightning-icon icon-name="utility:user" size="x-small"></lightning-icon>
                                <span>CUSTOMER DETAILS</span>
                            </div>

                            <div class="customer-box">
                                <div class="customer-row">
                                    <span class="c-label">Customer ID:</span>
                                    <span class="c-val font-mono">{activeCaseCustomerId}</span>
                                </div>
                                <div class="customer-row">
                                    <span class="c-label">Name:</span>
                                    <span class="c-val font-bold">{activeCaseCustomerName}</span>
                                </div>
                                <div class="customer-row">
                                    <span class="c-label">Email:</span>
                                    <span class="c-val">{activeCaseCustomerEmail}</span>
                                </div>
                                <div class="customer-row">
                                    <span class="c-label">Phone:</span>
                                    <span class="c-val">{activeCaseCustomerPhone}</span>
                                </div>
                                <div class="customer-row">
                                    <span class="c-label">Customer Type:</span>
                                    <span class="c-val">
                                        <template if:true={activeCaseIsVip}>
                                            <span class="badge-vip-gold">VIP Customer</span>
                                        </template>
                                        <template if:false={activeCaseIsVip}>
                                            <span class="badge-standard">Standard Customer</span>
                                        </template>
                                    </span>
                                </div>
                                <div class="customer-row">
                                    <span class="c-label">Status:</span>
                                    <span class="c-val text-success font-bold">Active Customer</span>
                                </div>
                            </div>

                            <!-- Integration Logs Section -->
                            <div class="section-title-strip">
                                <lightning-icon icon-name="utility:connected_apps" size="x-small"></lightning-icon>
                                <span>INTEGRATION LOGS</span>
                            </div>

                            <template if:true={hasActiveLogs}>
                                <div class="logs-feed">
                                    <template for:each={formattedActiveLogs} for:item="log">
                                        <div key={log.Id} class="log-entry">
                                            <div class={log.timelineIconClass}>
                                                <lightning-icon icon-name={log.iconName} size="xx-small"></lightning-icon>
                                            </div>
                                            <div class="log-meta">
                                                <div class="log-line-top">
                                                    <span class="log-service">{log.Service_Name__c}</span>
                                                    <span class={log.timelineBadgeClass}>{log.statusBadgeText}</span>
                                                </div>
                                                <template if:true={log.errorMessage}>
                                                    <div class="log-error-text">{log.errorMessage}</div>
                                                </template>
                                                <div class="log-line-bottom">
                                                    <span>{log.Name}</span> • <span>{log.executionTime}</span> • <span>{log.formattedDate}</span>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <template if:false={hasActiveLogs}>
                                <div class="empty-sub-card">
                                    <div class="empty-sub-title">NO INTEGRATION ACTIVITY</div>
                                    <div class="empty-sub-desc">No integration activity has been recorded for this Case.</div>
                                </div>
                            </template>
                        </template>

                        <template if:false={hasActiveCase}>
                            <div class="empty-state-box">
                                <lightning-icon icon-name="utility:connected_apps" size="small"></lightning-icon>
                                <div class="empty-state-title">No Case Selected</div>
                                <div class="empty-state-sub">Select a case from Panel 1 to view integration details.</div>
                            </div>
                        </template>
                    </div>

                    <!-- Panel 3 Dark Blue Footer Bar -->
                    <div class="panel-footer-bar">
                        <div class="footer-title">3. External API Integration</div>
                        <div class="footer-subtitle">Customer details retrieved and exceptions handled</div>
                    </div>
                </div>

                <!-- --------------------------------------------------------------- -->
                <!-- ROW 2 / PANEL 4: 4. AUTOMATION WITH APEX/FLOW -->
                <!-- --------------------------------------------------------------- -->
                <div class="panel-box panel-4">
                    <div class="panel-header">
                        <h2 class="panel-header-title">4. AUTOMATION WITH APEX/FLOW</h2>
                        <p class="panel-header-subtitle">Business logic to assign cases based on priority and customer data</p>
                    </div>

                    <div class="panel-body">
                        <!-- Visual Architecture Workflow -->
                        <div class="workflow-flowchart">
                            <div class="flow-node">
                                <div class="node-badge">1</div>
                                <div class="node-info">
                                    <div class="node-title">External System</div>
                                    <div class="node-desc">JSON Ticket Payload Dispatched</div>
                                </div>
                            </div>
                            <div class="flow-arrow">↓</div>

                            <div class="flow-node">
                                <div class="node-badge">2</div>
                                <div class="node-info">
                                    <div class="node-title">Apex REST API</div>
                                    <div class="node-desc">/services/apexrest/cases/v1</div>
                                </div>
                            </div>
                            <div class="flow-arrow">↓</div>

                            <div class="flow-node">
                                <div class="node-badge">3</div>
                                <div class="node-info">
                                    <div class="node-title">Request Validation</div>
                                    <div class="node-desc">Verify External ID & Subject</div>
                                </div>
                            </div>
                            <div class="flow-arrow">↓</div>

                            <div class="flow-node">
                                <div class="node-badge">4</div>
                                <div class="node-info">
                                    <div class="node-title">External_Case__c Staging</div>
                                    <div class="node-desc">Durable Ingestion & Idempotency</div>
                                </div>
                            </div>
                            <div class="flow-arrow">↓</div>

                            <div class="flow-node">
                                <div class="node-badge">5</div>
                                <div class="node-info">
                                    <div class="node-title">Queueable Apex</div>
                                    <div class="node-desc">CaseProcessingQueueable Execution</div>
                                </div>
                            </div>
                            <div class="flow-arrow">↓</div>

                            <div class="flow-node">
                                <div class="node-badge">6</div>
                                <div class="node-info">
                                    <div class="node-title">Customer REST API</div>
                                    <div class="node-desc">Named Credential Callout & VIP Fetch</div>
                                </div>
                            </div>
                            <div class="flow-arrow">↓</div>

                            <div class="flow-node">
                                <div class="node-badge">7</div>
                                <div class="node-info">
                                    <div class="node-title">Customer Matching</div>
                                    <div class="node-desc">Link Account & Contact Records</div>
                                </div>
                            </div>
                            <div class="flow-arrow">↓</div>

                            <div class="flow-node">
                                <div class="node-badge">8</div>
                                <div class="node-info">
                                    <div class="node-title">Salesforce Case</div>
                                    <div class="node-desc">Insert or Update Core Case</div>
                                </div>
                            </div>
                            <div class="flow-arrow">↓</div>

                            <div class="flow-node highlight">
                                <div class="node-badge highlight">9</div>
                                <div class="node-info">
                                    <div class="node-title">Smart Case Assignment</div>
                                    <div class="node-desc">Auto-Assigned to VIP/High/Std Queue</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Panel 4 Dark Blue Footer Bar -->
                    <div class="panel-footer-bar">
                        <div class="footer-title">4. Automation with Apex/Queueable</div>
                        <div class="footer-subtitle">Business logic processes and assigns Cases automatically</div>
                    </div>
                </div>

                <!-- --------------------------------------------------------------- -->
                <!-- ROW 2 / PANEL 5: 5. CUSTOMER SUPPORT ACTIVITY -->
                <!-- --------------------------------------------------------------- -->
                <div class="panel-box panel-5">
                    <div class="panel-header">
                        <div class="panel-header-row">
                            <div>
                                <h2 class="panel-header-title">5. CUSTOMER SUPPORT ACTIVITY</h2>
                                <p class="panel-header-subtitle">Track support activity and case progress</p>
                            </div>
                            <template if:true={hasActiveCase}>
                                <button class="header-action-btn" onclick={handleOpenActiveCaseModal}>
                                    Full Details ↗
                                </button>
                            </template>
                        </div>
                    </div>

                    <div class="panel-body">
                        <template if:true={hasActiveCase}>
                            <!-- Case Resolution Section -->
                            <div class="section-title-strip">
                                <lightning-icon icon-name="utility:check" size="x-small"></lightning-icon>
                                <span>CASE RESOLUTION</span>
                            </div>

                            <template if:true={activeCaseIsClosed}>
                                <div class="res-card-success">
                                    <div class="res-title-row">
                                        <span class="res-check-tag">✓ CASE RESOLVED</span>
                                        <span class="res-date-text">{activeCaseResolvedDateFormatted}</span>
                                    </div>
                                    <div class="res-content">
                                        <div class="res-item">
                                            <span class="res-lbl">Resolution Summary</span>
                                            <span class="res-val font-bold text-success">{activeCaseResolutionSummary}</span>
                                        </div>
                                        <div class="res-item">
                                            <span class="res-lbl">Resolution Notes</span>
                                            <span class="res-val">{activeCaseResolutionNotes}</span>
                                        </div>
                                        <div class="res-item">
                                            <span class="res-lbl">Resolved By</span>
                                            <span class="res-val font-semibold">{activeCaseResolvedByName}</span>
                                        </div>
                                        <div class="res-item">
                                            <span class="res-lbl">Resolved Date</span>
                                            <span class="res-val">{activeCaseResolvedDateFormatted}</span>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <template if:false={activeCaseIsClosed}>
                                <div class="res-card-open">
                                    <div class="res-title-row">
                                        <span class="res-open-tag">● CASE IN PROGRESS</span>
                                    </div>
                                    <p class="res-open-desc">No resolution recorded yet. Case is currently open or working.</p>
                                    <button class="btn-resolve-trigger" onclick={handleResolveActiveCase}>
                                        <lightning-icon icon-name="utility:check" size="x-small" variant="inverse"></lightning-icon>
                                        Mark as Closed
                                    </button>
                                </div>
                            </template>

                            <!-- Support Activity Section -->
                            <div class="section-title-strip">
                                <lightning-icon icon-name="utility:activity" size="x-small"></lightning-icon>
                                <span>SUPPORT ACTIVITY</span>
                            </div>

                            <template if:true={hasActiveActivities}>
                                <div class="activities-list">
                                    <template for:each={formattedActiveActivities} for:item="act">
                                        <div key={act.Id} class="activity-card">
                                            <div class="act-icon">
                                                <lightning-icon icon-name={act.iconName} size="x-small"></lightning-icon>
                                            </div>
                                            <div class="act-details">
                                                <div class="act-top">
                                                    <span class="act-subj">{act.Subject}</span>
                                                    <span class={act.activityBadgeClass}>{act.Status}</span>
                                                </div>
                                                <div class="act-desc">{act.descriptionText}</div>
                                                <div class="act-foot">
                                                    <span>Agent: {act.ownerName}</span> • <span>Date: {act.formattedDate}</span>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <template if:false={hasActiveActivities}>
                                <div class="empty-sub-card">
                                    <div class="empty-sub-title">NO RECENT ACTIVITIES</div>
                                    <div class="empty-sub-desc">No activities recorded for this Case.</div>
                                </div>
                            </template>
                        </template>

                        <template if:false={hasActiveCase}>
                            <div class="empty-state-box">
                                <lightning-icon icon-name="utility:activity" size="small"></lightning-icon>
                                <div class="empty-state-title">No Case Selected</div>
                                <div class="empty-state-sub">Select a case from Panel 1 to inspect support activity.</div>
                            </div>
                        </template>
                    </div>

                    <!-- Panel 5 Dark Blue Footer Bar -->
                    <div class="panel-footer-bar">
                        <div class="footer-title">5. Customer Support Activity</div>
                        <div class="footer-subtitle">Track support activity and case progress</div>
                    </div>
                </div>

                <!-- --------------------------------------------------------------- -->
                <!-- ROW 2 / PANEL 6: 6. DASHBOARD & REPORTING -->
                <!-- --------------------------------------------------------------- -->
                <div class="panel-box panel-6">
                    <div class="panel-header">
                        <h2 class="panel-header-title">6. DASHBOARD & REPORTING</h2>
                        <p class="panel-header-subtitle">Real-time visibility of case trends and resolution metrics</p>
                    </div>

                    <div class="panel-body">
                        <!-- Dynamic Metric Numbers -->
                        <div class="mini-metrics-grid">
                            <div class="metric-cell">
                                <div class="metric-label">TOTAL CASES</div>
                                <div class="metric-value">{metrics.total}</div>
                            </div>
                            <div class="metric-cell">
                                <div class="metric-label">OPEN CASES</div>
                                <div class="metric-value text-amber">{metrics.open}</div>
                            </div>
                            <div class="metric-cell">
                                <div class="metric-label">CLOSED CASES</div>
                                <div class="metric-value text-green">{metrics.closed}</div>
                            </div>
                            <div class="metric-cell">
                                <div class="metric-label">HIGH PRIORITY</div>
                                <div class="metric-value text-red">{metrics.highPriority}</div>
                            </div>
                            <div class="metric-cell">
                                <div class="metric-label">VIP CASES</div>
                                <div class="metric-value text-purple">{metrics.vip}</div>
                            </div>
                        </div>

                        <!-- Cases By Priority -->
                        <div class="section-title-strip">
                            <lightning-icon icon-name="utility:priority" size="x-small"></lightning-icon>
                            <span>CASES BY PRIORITY</span>
                        </div>

                        <div class="dist-chart-group">
                            <div class="dist-bar-item">
                                <div class="dist-bar-info">
                                    <span class="dist-name">High Priority</span>
                                    <span class="dist-count">{priorityDistribution.highCount} ({priorityDistribution.highPercent}%)</span>
                                </div>
                                <div class="dist-track">
                                    <div class="dist-fill fill-high" style={priorityDistribution.highStyle}></div>
                                </div>
                            </div>
                            <div class="dist-bar-item">
                                <div class="dist-bar-info">
                                    <span class="dist-name">Medium Priority</span>
                                    <span class="dist-count">{priorityDistribution.mediumCount} ({priorityDistribution.mediumPercent}%)</span>
                                </div>
                                <div class="dist-track">
                                    <div class="dist-fill fill-medium" style={priorityDistribution.mediumStyle}></div>
                                </div>
                            </div>
                            <div class="dist-bar-item">
                                <div class="dist-bar-info">
                                    <span class="dist-name">Low Priority</span>
                                    <span class="dist-count">{priorityDistribution.lowCount} ({priorityDistribution.lowPercent}%)</span>
                                </div>
                                <div class="dist-track">
                                    <div class="dist-fill fill-low" style={priorityDistribution.lowStyle}></div>
                                </div>
                            </div>
                        </div>

                        <!-- Cases By Status -->
                        <div class="section-title-strip">
                            <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
                            <span>CASES BY STATUS</span>
                        </div>

                        <div class="dist-chart-group">
                            <div class="dist-bar-item">
                                <div class="dist-bar-info">
                                    <span class="dist-name">New</span>
                                    <span class="dist-count">{statusDistribution.newCount} ({statusDistribution.newPercent}%)</span>
                                </div>
                                <div class="dist-track">
                                    <div class="dist-fill fill-new" style={statusDistribution.newStyle}></div>
                                </div>
                            </div>
                            <div class="dist-bar-item">
                                <div class="dist-bar-info">
                                    <span class="dist-name">Working / In Progress</span>
                                    <span class="dist-count">{statusDistribution.workingCount} ({statusDistribution.workingPercent}%)</span>
                                </div>
                                <div class="dist-track">
                                    <div class="dist-fill fill-working" style={statusDistribution.workingStyle}></div>
                                </div>
                            </div>
                            <div class="dist-bar-item">
                                <div class="dist-bar-info">
                                    <span class="dist-name">Closed</span>
                                    <span class="dist-count">{statusDistribution.closedCount} ({statusDistribution.closedPercent}%)</span>
                                </div>
                                <div class="dist-track">
                                    <div class="dist-fill fill-closed" style={statusDistribution.closedStyle}></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Panel 6 Dark Blue Footer Bar -->
                    <div class="panel-footer-bar">
                        <div class="footer-title">6. Dashboard & Reporting</div>
                        <div class="footer-subtitle">Real-time visibility of case trends and resolution metrics</div>
                    </div>
                </div>

            </div>

            <!-- ================= BOTTOM FEATURE STRIP ================= -->
            <footer class="bottom-feature-strip">
                <div class="feature-card">
                    <div class="feature-icon-box">⚙</div>
                    <div class="feature-texts">
                        <div class="feature-title">Automated Case Management</div>
                        <div class="feature-subtitle">Reduces manual effort</div>
                    </div>
                </div>

                <div class="feature-card">
                    <div class="feature-icon-box">🔗</div>
                    <div class="feature-texts">
                        <div class="feature-title">External System Integration</div>
                        <div class="feature-subtitle">Real-time customer data</div>
                    </div>
                </div>

                <div class="feature-card">
                    <div class="feature-icon-box">👥</div>
                    <div class="feature-texts">
                        <div class="feature-title">Smart Case Assignment</div>
                        <div class="feature-subtitle">Improves response time</div>
                    </div>
                </div>

                <div class="feature-card">
                    <div class="feature-icon-box">✓</div>
                    <div class="feature-texts">
                        <div class="feature-title">Case Resolution Tracking</div>
                        <div class="feature-subtitle">Complete resolution visibility</div>
                    </div>
                </div>

                <div class="feature-card">
                    <div class="feature-icon-box">⚠</div>
                    <div class="feature-texts">
                        <div class="feature-title">Error Handling & Logging</div>
                        <div class="feature-subtitle">Robust and reliable solution</div>
                    </div>
                </div>

                <div class="feature-card">
                    <div class="feature-icon-box">🛡</div>
                    <div class="feature-texts">
                        <div class="feature-title">Apex Automated Testing</div>
                        <div class="feature-subtitle">Ensures code quality</div>
                    </div>
                </div>
            </footer>

            <!-- ================= MODAL: CASE DETAILS & LOGS ================= -->
            <template if:true={isModalOpen}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open" aria-labelledby="modal-heading-01" aria-modal="true">
                    <div class="slds-modal__container modal-wide">
                        <header class="slds-modal__header modal-custom-header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                                <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                                <span class="slds-assistive-text">Close</span>
                            </button>
                            <div class="modal-hdr-top">
                                <span class="modal-hdr-case">CASE #{selectedCase.CaseNumber}</span>
                                <div class="modal-hdr-badges">
                                    <span class={selectedCasePriorityBadgeClass}>{selectedCase.Priority}</span>
                                    <span class={selectedCaseStatusBadgeClass}>
                                        <span class="status-dot"></span>
                                        {selectedCase.Status}
                                    </span>
                                </div>
                            </div>
                            <h2 id="modal-heading-01" class="modal-hdr-title">{selectedCase.Subject}</h2>
                        </header>
                        <div class="slds-modal__content modal-custom-body" id="modal-content-id-1">
                            <lightning-tabset class="modal-tabs">
                                <!-- TAB 1: CASE INFORMATION -->
                                <lightning-tab label="Case Information">
                                    <div class="tab-padding">
                                        <div class="modal-kv-grid">
                                            <div class="modal-kv">
                                                <span class="m-lbl">Priority</span>
                                                <span class={selectedCasePriorityBadgeClass}>{selectedCase.Priority}</span>
                                            </div>
                                            <div class="modal-kv">
                                                <span class="m-lbl">Status</span>
                                                <span class={selectedCaseStatusBadgeClass}>{selectedCase.Status}</span>
                                            </div>
                                            <div class="modal-kv">
                                                <span class="m-lbl">Customer Tier</span>
                                                <template if:true={selectedCase.Is_VIP__c}>
                                                    <span class="badge-vip-gold">★ VIP Customer</span>
                                                </template>
                                                <template if:false={selectedCase.Is_VIP__c}>
                                                    <span class="badge-standard">Standard Customer</span>
                                                </template>
                                            </div>
                                            <div class="modal-kv">
                                                <span class="m-lbl">Owner</span>
                                                <span class="m-val font-bold">{selectedCaseOwnerName}</span>
                                            </div>
                                            <div class="modal-kv">
                                                <span class="m-lbl">External Case ID</span>
                                                <span class="m-val font-mono">{selectedCaseExternalIdFormatted}</span>
                                            </div>
                                            <div class="modal-kv full-width">
                                                <span class="m-lbl">Description</span>
                                                <p class="m-desc">{selectedCaseDescriptionFormatted}</p>
                                            </div>
                                        </div>

                                        <!-- Resolution in Tab 1 -->
                                        <div class="section-title-strip" style="margin-top:16px;">
                                            <lightning-icon icon-name="utility:check" size="x-small"></lightning-icon>
                                            <span>RESOLUTION DETAILS</span>
                                        </div>
                                        <template if:true={isCaseClosed}>
                                            <div class="res-card-success">
                                                <div class="res-title-row">
                                                    <span class="res-check-tag">✓ CASE RESOLVED</span>
                                                    <span class="res-date-text">{selectedCaseResolvedDateFormatted}</span>
                                                </div>
                                                <div class="res-content">
                                                    <div class="res-item">
                                                        <span class="res-lbl">Resolution Summary:</span>
                                                        <span class="res-val font-bold text-success">{selectedCaseResolutionSummary}</span>
                                                    </div>
                                                    <div class="res-item">
                                                        <span class="res-lbl">Resolution Notes:</span>
                                                        <span class="res-val">{selectedCaseResolutionNotes}</span>
                                                    </div>
                                                    <div class="res-item">
                                                        <span class="res-lbl">Resolved By:</span>
                                                        <span class="res-val font-semibold">{selectedCaseResolvedByName}</span>
                                                    </div>
                                                    <div class="res-item">
                                                        <span class="res-lbl">Resolved Date:</span>
                                                        <span class="res-val">{selectedCaseResolvedDateFormatted}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>
                                        <template if:false={isCaseClosed}>
                                            <div class="empty-sub-card">
                                                <div class="empty-sub-desc">No resolution recorded yet. Case is currently open.</div>
                                            </div>
                                        </template>
                                    </div>
                                </lightning-tab>

                                <!-- TAB 2: CUSTOMER INFORMATION -->
                                <lightning-tab label="Customer Information">
                                    <div class="tab-padding">
                                        <div class="customer-box">
                                            <div class="customer-row">
                                                <span class="c-label">Customer ID:</span>
                                                <span class="c-val font-mono">{selectedCaseCustomerId}</span>
                                            </div>
                                            <div class="customer-row">
                                                <span class="c-label">Customer Name:</span>
                                                <span class="c-val font-bold">{selectedCaseCustomerName}</span>
                                            </div>
                                            <div class="customer-row">
                                                <span class="c-label">Email:</span>
                                                <span class="c-val">{selectedCaseCustomerEmail}</span>
                                            </div>
                                            <div class="customer-row">
                                                <span class="c-label">Phone:</span>
                                                <span class="c-val">{selectedCaseCustomerPhone}</span>
                                            </div>
                                            <div class="customer-row">
                                                <span class="c-label">Company / Account:</span>
                                                <span class="c-val font-semibold">{selectedCaseAccountName}</span>
                                            </div>
                                            <div class="customer-row">
                                                <span class="c-label">Customer Status:</span>
                                                <span class="c-val text-success font-bold">Active Customer</span>
                                            </div>
                                        </div>
                                    </div>
                                </lightning-tab>

                                <!-- TAB 3: ACTIVITIES -->
                                <lightning-tab label="Activities">
                                    <div class="tab-padding">
                                        <template if:true={hasModalActivities}>
                                            <div class="activities-list">
                                                <template for:each={formattedModalActivities} for:item="act">
                                                    <div key={act.Id} class="activity-card">
                                                        <div class="act-icon">
                                                            <lightning-icon icon-name={act.iconName} size="x-small"></lightning-icon>
                                                        </div>
                                                        <div class="act-details">
                                                            <div class="act-top">
                                                                <span class="act-subj">{act.Subject}</span>
                                                                <span class={act.activityBadgeClass}>{act.Status}</span>
                                                            </div>
                                                            <div class="act-desc">{act.descriptionText}</div>
                                                            <div class="act-foot">
                                                                <span>Agent: {act.ownerName}</span> • <span>Due: {act.formattedDate}</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                        <template if:false={hasModalActivities}>
                                            <div class="empty-sub-card">
                                                <div class="empty-sub-title">NO RECENT ACTIVITIES</div>
                                                <div class="empty-sub-desc">No activities recorded for this Case.</div>
                                            </div>
                                        </template>
                                    </div>
                                </lightning-tab>

                                <!-- TAB 4: INTEGRATION ACTIVITY -->
                                <lightning-tab label="Integration Activity">
                                    <div class="tab-padding">
                                        <template if:true={hasLogs}>
                                            <div class="logs-feed">
                                                <template for:each={formattedLogs} for:item="log">
                                                    <div key={log.Id} class="log-entry">
                                                        <div class={log.timelineIconClass}>
                                                            <lightning-icon icon-name={log.iconName} size="xx-small"></lightning-icon>
                                                        </div>
                                                        <div class="log-meta">
                                                            <div class="log-line-top">
                                                                <span class="log-service">{log.Service_Name__c} Event</span>
                                                                <span class={log.timelineBadgeClass}>{log.statusBadgeText}</span>
                                                            </div>
                                                            <template if:true={log.errorMessage}>
                                                                <div class="log-error-text">{log.errorMessage}</div>
                                                            </template>
                                                            <div class="log-line-bottom">
                                                                <span>Log ID: {log.Name}</span> • <span>Execution: {log.executionTime}</span> • <span>Timestamp: {log.CreatedDate}</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                        <template if:false={hasLogs}>
                                            <div class="empty-sub-card">
                                                <div class="empty-sub-title">NO INTEGRATION ACTIVITY</div>
                                                <div class="empty-sub-desc">No integration activity has been recorded for this Case.</div>
                                            </div>
                                        </template>
                                    </div>
                                </lightning-tab>
                            </lightning-tabset>
                        </div>
                        <footer class="slds-modal__footer">
                            <lightning-button label="Close" variant="neutral" onclick={closeModal}></lightning-button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

            <!-- ================= MODAL: MARK CASE AS CLOSED ================= -->
            <template if:true={isCloseModalOpen}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open" aria-labelledby="modal-heading-02" aria-modal="true">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header modal-custom-header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeCloseModal}>
                                <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                                <span class="slds-assistive-text">Close</span>
                            </button>
                            <h2 id="modal-heading-02" class="slds-modal__title slds-hyphenate">MARK CASE AS CLOSED</h2>
                            <p class="modal-hdr-sub">Document how the customer's issue was resolved.</p>
                        </header>
                        <div class="slds-modal__content slds-var-p-around_large" id="modal-content-id-2">
                            <lightning-input
                                name="resolutionSummary"
                                label="Resolution Summary"
                                placeholder="Brief summary of resolution..."
                                value={resolutionSummaryInput}
                                onchange={handleResolutionSummaryChange}
                                required
                                class="slds-var-m-bottom_small">
                            </lightning-input>
                            <lightning-textarea
                                name="resolutionNotes"
                                label="Resolution Notes"
                                placeholder="Describe how the customer's issue was resolved..."
                                value={resolutionNotesInput}
                                onchange={handleResolutionNotesChange}
                                required
                                class="slds-var-m-bottom_small">
                            </lightning-textarea>
                        </div>
                        <footer class="slds-modal__footer">
                            <lightning-button label="Cancel" variant="neutral" onclick={closeCloseModal} class="slds-var-m-right_x-small"></lightning-button>
                            <lightning-button label="Close Case" variant="brand" onclick={confirmCloseCase}></lightning-button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>

        </div>
    </div>
</template>
